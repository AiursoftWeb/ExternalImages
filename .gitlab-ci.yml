deploy_shepherd_140fixed:
  extends: .deploy_template
  variables:
    IMAGE_NAME: "shepherd-140fixed"
    CONTEXT: "./Shepherd140Fixed"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - .gitlab-ci.yml
        - Shepherd140Fixed/**/*

s360_npm:
  stage: s360
  before_script:
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - dotnet tool update Aiursoft.S360.Client --global --add-source https://nuget.aiursoft.com/v3/index.json
  script:
    - s360 check --path AsrApi/web --ecosystem npm --npm-lockfile-only --purpose "$S360_PURPOSE"
  retry:
    max: 2
    when: runner_system_failure
  rules:
    - changes:
        - .gitlab-ci.yml
        - ninja.yaml
        - AsrApi/**/*
