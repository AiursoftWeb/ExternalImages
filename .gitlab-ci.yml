stages:
  - deploy

.deploy_template:
  stage: deploy
  timeout: 6 hours
  variables:
    PLATFORMS: "linux/amd64,linux/arm64"
    BUILD_ARGS: ""
  before_script:
    - if [[ "$CI_PROJECT_NAMESPACE" != "aiursoft" ]]; then
        echo "CI pipeline will only run for the Aiursoft namespace.";
        exit 1;
      fi
    - echo "Logging in to the home registry..."
    - echo "$LOCAL_DOCKER_PASSWORD" | docker login hub.aiursoft.com -u "$LOCAL_DOCKER_USERNAME" --password-stdin
    - echo "Logging in to Docker Hub..."
    - echo "$DOCKER_PASSWORD" | docker login docker.io -u "$DOCKER_USERNAME" --password-stdin
    - docker buildx use aiur-global-builder
  script:
    - if [[ "$CI_COMMIT_BRANCH" == "master" ]]; then TAG="latest"; else TAG="$CI_COMMIT_REF_SLUG"; fi
    - INTERNAL_TARGET="hub.aiursoft.com/aiursoft/$IMAGE_NAME:$TAG"
    - PUBLIC_TARGET="docker.io/aiursoft/$IMAGE_NAME:$TAG"
    - echo "Building $INTERNAL_TARGET and $PUBLIC_TARGET"
    - docker buildx build $BUILD_ARGS "$CONTEXT" --platform "$PLATFORMS" -t "$INTERNAL_TARGET" -t "$PUBLIC_TARGET" --push

deploy_gateway:
  extends: .deploy_template
  variables:
    IMAGE_NAME: "gateway"
    CONTEXT: "./Gateway"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - .gitlab-ci.yml
        - Gateway/**/*

deploy_asr_api:
  extends: .deploy_template
  variables:
    IMAGE_NAME: "asr-api"
    CONTEXT: "./AsrApi"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - .gitlab-ci.yml
        - AsrApi/**/*

deploy_folder_agent:
  extends: .deploy_template
  variables:
    IMAGE_NAME: "folderagent"
    CONTEXT: "./FolderAgent"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - .gitlab-ci.yml
        - FolderAgent/**/*

deploy_markitdown:
  extends: .deploy_template
  variables:
    IMAGE_NAME: "markitdown"
    CONTEXT: "./MarkItDown"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - .gitlab-ci.yml
        - MarkItDown/**/*

deploy_whisperx:
  extends: .deploy_template
  variables:
    IMAGE_NAME: "whisperx"
    CONTEXT: "./WhisperX"
    PLATFORMS: "linux/amd64"
    BUILD_ARGS: "--build-arg SINGLE_MODEL=true --build-arg USE_PYPI_MIRROR=true"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - .gitlab-ci.yml
        - WhisperX/**/*

.alertcenter_report:
    stage: .post
    inherit:
        default: false
    rules:
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    dependencies: []
    resource_group: "alertcenter-$CI_COMMIT_REF_SLUG"
    timeout: 10m
    allow_failure: true
    retry:
        max: 2
        when: script_failure
    before_script:
        - |
            set +x
            test -n "${ALERTCENTER_SERVER:-}" && test -n "${ALERTCENTER_API_KEY:-}" || {
                echo "AlertCenter server or API key is not configured."
                exit 1
            }
            mkdir -p "$CI_PROJECT_DIR/.alertcenter-tools"
            cat > "$CI_PROJECT_DIR/.alertcenter-tools/nuget.config" <<'NUGETEOF'
            <configuration><packageSources><clear/><add key="aiursoft" value="https://nuget.aiursoft.com/v3/index.json"/></packageSources></configuration>
            NUGETEOF
            dotnet tool install Aiursoft.AlertCenter.Client --version 10.8.0 --tool-path "$CI_PROJECT_DIR/.alertcenter-tools" --configfile "$CI_PROJECT_DIR/.alertcenter-tools/nuget.config"
    script:
        - .alertcenter-tools/alertcenter ci report --result "$ALERTCENTER_RESULT" --server "$ALERTCENTER_SERVER" --api-key "$ALERTCENTER_API_KEY"

alertcenter_failure:
    extends: .alertcenter_report
    when: on_failure
    variables:
        ALERTCENTER_RESULT: failed

alertcenter_success:
    extends: .alertcenter_report
    when: on_success
    variables:
        ALERTCENTER_RESULT: success
