  extends: .deploy_template
  variables:
    IMAGE_NAME: "whisperx"
    CONTEXT: "./WhisperX"
    PLATFORMS: "linux/amd64"
    BUILD_ARGS: "--build-arg SINGLE_MODEL=true --build-arg USE_PYPI_MIRROR=false"
