test_clickhouse_app_log_error_monitor:
  stage: test
  image: python:3.13-slim
  script:
    - python3 -m unittest discover -s ClickHouseAppLogErrorMonitor/tests -v
  rules:
    - changes:
        - .gitlab-ci.yml
        - ClickHouseAppLogErrorMonitor/**/*

deploy_clickhouse_app_log_error_monitor:
  extends: .deploy_template
  variables:
    IMAGE_NAME: "clickhouse_app_log_error_monitor"
