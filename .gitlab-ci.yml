workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == "master"'
      variables:
        S360_PURPOSE: baseline
        S360_CHECK_KEY: "$S360_BASELINE_KEY"
    - if: '$CI_COMMIT_BRANCH'

variables:
  S360_PURPOSE: review
  S360_CHECK_KEY: ""

stages:
  - s360
  - test
  - deploy

.deploy_template:
  stage: deploy
  timeout: 6 hours
  variables:
    PLATFORMS: "linux/amd64,linux/arm64"
    BUILD_ARGS: ""
  before_script:
    - if [[ "$CI_PROJECT_NAMESPACE" != "aiursoft" ]]; then
        echo "CI pipeline will only run for the Aiursoft namespace.";
        exit 1;
      fi
    - echo "Logging in to the home registry..."
    - echo "$LOCAL_DOCKER_PASSWORD" | docker login hub.aiursoft.com -u "$LOCAL_DOCKER_USERNAME" --password-stdin
    - echo "Logging in to Docker Hub..."
    - echo "$DOCKER_PASSWORD" | docker login docker.io -u "$DOCKER_USERNAME" --password-stdin
    - docker buildx use aiur-global-builder
  script:
    - if [[ "$CI_COMMIT_BRANCH" == "master" ]]; then TAG="latest"; else TAG="$CI_COMMIT_REF_SLUG"; fi
    - INTERNAL_TARGET="hub.aiursoft.com/aiursoft/$IMAGE_NAME:$TAG"
    - PUBLIC_TARGET="docker.io/aiursoft/$IMAGE_NAME:$TAG"
    - echo "Building $INTERNAL_TARGET and $PUBLIC_TARGET"
    - docker buildx build $BUILD_ARGS "$CONTEXT" --platform "$PLATFORMS" -t "$INTERNAL_TARGET" -t "$PUBLIC_TARGET" --push

deploy_gateway:
  extends: .deploy_template
  variables:
    IMAGE_NAME: "gateway"
    CONTEXT: "./Gateway"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - .gitlab-ci.yml
        - Gateway/**/*

deploy_asr_api:
  extends: .deploy_template
  variables:
    IMAGE_NAME: "asr-api"
    CONTEXT: "./AsrApi"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - .gitlab-ci.yml
        - AsrApi/**/*

deploy_folder_agent:
  extends: .deploy_template
  variables:
    IMAGE_NAME: "folderagent"
    CONTEXT: "./FolderAgent"
