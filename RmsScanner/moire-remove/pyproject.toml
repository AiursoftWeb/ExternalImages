[project]
name = "more-clean"
version = "0.1.0"
description = "Local pretrained MBCNN image demoireing CLI and Chinese Web UI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "h5py>=3.16.0",
    "numpy>=2.5.4",
    "torch==2.6.0+cpu",
    "pillow>=11.0,<13",
    "typer>=0.16,<1",
]

[project.scripts]
more-clean = "more_clean.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/more_clean"]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
